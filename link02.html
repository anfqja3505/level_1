<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>링크태그</title>
</head>
<body>
    <h1>링크태그</h1>
    <h2>절대경로</h2>
    <p>http://로 시작하는 실제 웹 서비스 주소</p>
    <a href="http://google.com" target="_blank">구글 바로가기</a>
    <a href="http://naver.com" target="_blank">네이버 바로가기</a>
    <a href="https://www.apple.com" target="_blank">애플 바로가기</a>
    <!-- 네이버 쇼핑탭 클론코딩 -->
    <div id="shopping_wrap">
        <!-- 1.쇼핑 제목 탭 -->
        <div class="title_contrls_wrap">
            <div class="title_menu">
                <a href="#">쇼핑</a>
                <img src="" alt="">
                <a href="#">맨즈</a>
                <img src="" alt="">
                <a href="#">브랜드샵</a>
                <img src="" alt="">
                <a href="#" class="active">MY추천</a>
                <img src="" alt="">
                <a href="#">추천핫딜</a>
                <img src="" alt="">
                <a href="#">쇼핑라이브</a>
            </div><!-- e:title_menu -->
            <div class="page">
                <em class="current_page">1</em>
                <span class="total_page">/12</span>
                <a href="#" class="prev_btn"><img src="" alt="이전상품보기"></a>
                <a href="#" class="next_btn"><img src="" alt="다음상품보기"></a>
            </div><!-- e:page  -->
        </div><!-- e:title_controls_wrap -->
        <!-- 2.쇼핑 내용(광고, 주문, 추천태그, 상품목록) -->
        <div class="container">
            <div class="side_bar">
                <div class="shopping_site">
                    <a href="" target="_blank">쿠팡</a>
                    <a href="" target="_blank">g마켓</a>
                    <a href="" target="_blank">옥션</a>
                    <a href="" target="_blank">11번가</a>
                    <a href="" target="_blank">올리브영</a>
                    <a href="" target="_blank">SSG닷컴</a>
                    <a href="" target="_blank">하프클럽</a>
                    <a href="" target="_blank">이마트몰</a>
                    <a href="" target="_blank">GSSHOP</a>
                    <a href="" target="_blank">패션플러스</a>
                </div><!-- e:shopping_site -->
                <div class="shopping_delivery_basket">
                    <a href="#" class="shopping_delivery">주문배송 <img src="" alt="3"></a>
                    <img src="" alt="">
                    <a href="#" class="shopping_basket">장바구니 <img src="" alt="1"></a>
                </div><!-- e:shopping_delivery_basket -->
                <div class="category">
                    <a href="#" class="active">#가구/인테리어</a>
                    <a href="#">#생활/건강</a>
                    <a href="#">#패션의류</a>
                    <a href="#">#식품</a>
                    <a href="#">#출산/육아</a>
                    <a href="#">#패션잡화</a>
                </div><!-- e:category -->
            </div><!-- e:side_bar -->
            <div class="right_contents">
                <a href="#" class="product">
                    <p class="photo"><img src="" alt=""></p>
                    <p class="msg">누적리뷰 1만개이상</p>
                    <h2>에포트리스 체인지시트</h2>
                    <div class="review_score_wrap">
                        <p class="score"><img src="" alt="별점"> 4.79</p>
                        <p class="review">리뷰 225</p>
                    </div>
                </a><!-- *8 -->
            </div><!-- e:right_contents -->
        </div><!-- e:container -->
        <!-- 3.내용 더보기 -->
        <div class="more_wrap">
            <div class="center">
                <a href="#"><img src="" alt="이전보기"></a>
                <div class="more_page">
                    <em>MY추천</em>
                    <span>더보기</span>
                    <em class="current_page">1</em>
                    <span class="total_page">/12</span>
                </div>
                <a href="#"><img src="" alt="다음보기"></a>
            </div>
            <a href="#" class="ad_btn">AD</a>
        </div>
    </div><!-- e:전체 shopping_wrap -->
</body>
</html>
